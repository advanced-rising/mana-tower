<!doctype html><meta charset="utf-8"><body style="margin:0;background:#111">
<iframe id="f" src="index.html" style="width:390px;height:1400px;border:0"></iframe>
<script>
const f=document.getElementById('f');
f.onload=()=>setTimeout(()=>{
  const w=f.contentWindow,d=f.contentDocument;
  const b=[...d.querySelectorAll('button')].find(x=>/확인|OK/.test(x.textContent)); if(b) b.click();
  const G=w.__game,S=G.S;
  G.TABS.forEach(t=>{t.open=()=>true});
  S.manaPeakL=400;S.manaEverL=400;S.manaL=264.7;S.deepest=5.1e10;S.deepestEver=5.1e10;
  ['soul','relic','star','crystal','offering'].forEach(k=>{S[k+'L']=264.7;G.syncRes(k);S[(k==='offering'?'offerEver':k+'Ever')+'L']=264.7});
  S.offerEver=1e40;S.crystalEver=1e40;S.soulEver=1e40;S.relicEver=1e40;S.starEver=1e40;
  S.infEver=100;S.eterEver=20;S.realEver=15;S.voidEver=12;S.originEver=8;
  G.recalc(); G.buildTabs(); G.switchTab('tower');
  setTimeout(()=>{ for(let i=0;i<3;i++) G.refresh() },250);
},900);
</script>
