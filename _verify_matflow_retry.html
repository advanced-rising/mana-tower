<script>
/* 번들보다 먼저 걸어 두는 감시자. 순수 ES5 로만 쓴다 — 구형 브라우저가
   번들을 파싱조차 못 해도 이건 돌아야 하기 때문이다.
   index.html 에는 로고 말고 보이는 것이 없어서, 번들이 죽으면 화면은
   그냥 검게 남고 무엇이 잘못됐는지 알 길이 없었다. */
window.__watchdog = { errs: [], loaded: false };
(function () {                       // 여기까지 왔다면 스크립트는 돌고 있다
  var m = document.getElementById('bootMsg');
  if (m) m.textContent = '자원을 받는 중…';
})();
window.addEventListener('error', function (e) {
  var w = window.__watchdog;
  if (w.errs.length > 8) return;
  if (e && e.target && e.target.tagName === 'SCRIPT') { w.errs.push('스크립트를 못 불러옴: ' + (e.target.src || '')); return; }
  if (e && e.target && e.target.tagName === 'LINK') { w.errs.push('스타일을 못 불러옴: ' + (e.target.href || '')); return; }
  var at = (e && e.filename ? String(e.filename).split('/').pop() : '') + (e && e.lineno ? ':' + e.lineno : '');
  w.errs.push(((e && e.message) || 'error') + (at ? '  @ ' + at : ''));
}, true);
window.addEventListener('unhandledrejection', function (e) {
  window.__watchdog.errs.push('처리되지 않은 거부: ' + ((e && e.reason && (e.reason.message || e.reason)) || ''));
});
setTimeout(function () {
  if (window.__game) return;
  var w = window.__watchdog;
  var esc = function (t) { return String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); };
  var save = ''; try { save = localStorage.getItem('manaTowerSave2') || ''; } catch (err) { save = '(읽을 수 없음)'; }
  var lines = [];
  lines.push('번들 파일: ' + (w.loaded ? '받았습니다' : '받지 못했습니다'));
  lines.push('세이브: ' + (save ? save.length + '자' : '없음'));
  lines.push('브라우저: ' + navigator.userAgent);
  var html = '<div style="max-width:680px;margin:32px auto;padding:20px;font:14px/1.7 system-ui,-apple-system,sans-serif;color:#ddd">'
    + '<h2 style="margin:0 0 12px;color:#e8c46a">게임을 여는 데 실패했습니다</h2>'
    + '<p>아래 내용을 그대로 복사해서 알려 주시면 원인을 바로 찾을 수 있습니다.</p>'
    + '<pre id="wdInfo" style="white-space:pre-wrap;word-break:break-all;background:#15151a;border:1px solid #333;padding:12px;font:12px/1.6 monospace;color:#ccc">'
    + esc(lines.join('\n')) + '\n\n'
    + (w.errs.length ? esc(w.errs.join('\n')) : '자바스크립트 오류는 잡히지 않았습니다.')
    + '</pre>'
    + '<p><button id="wdCopy" style="padding:9px 16px;margin-right:8px">위 내용 복사</button>'
    + '<button id="wdRetry" style="padding:9px 16px;margin-right:8px">다시 시도</button>'
    + (save ? '<button id="wdWipe" style="padding:9px 16px">세이브 지우고 열기</button>' : '')
    + '</p>'
    + (save ? '<p style="font-size:12px;color:#888">세이브를 지우기 전에 아래에서 먼저 복사해 두세요.</p>'
      + '<textarea id="wdSave" readonly style="width:100%;height:100px;font:11px monospace">' + esc(save) + '</textarea>' : '')
    + '</div>';
  document.body.innerHTML = html;
  var $ = function (id) { return document.getElementById(id); };
  if ($('wdCopy')) $('wdCopy').onclick = function () {
    var t = document.createElement('textarea');
    t.value = $('wdInfo').textContent; document.body.appendChild(t); t.select();
    try { document.execCommand('copy'); this.textContent = '복사했습니다'; } catch (err) { this.textContent = '직접 선택해 주세요'; }
    document.body.removeChild(t);
  };
  if ($('wdRetry')) $('wdRetry').onclick = function () { location.reload(); };
  if ($('wdWipe')) $('wdWipe').onclick = function () {
    if (!confirm('세이브를 지우고 처음부터 시작합니다. 계속할까요?')) return;
    try { localStorage.removeItem('manaTowerSave2'); } catch (err) {}
    location.reload();
  };
}, 6000);
</script>

<script>
/* 번들을 첫 그리기 뒤에 돌린다. 스크립트 태그를 그냥 두면 파서가 여기서 멈춰
   번들이 끝날 때까지 아무것도 안 그려진다 — 번들이 멈추면 영영 검은 화면이다.
   한 프레임 그린 뒤에 붙이면, 무슨 일이 생겨도 위 안내는 남는다. */
(function () {
  var url = document.getElementById('gameScript').getAttribute('data-src');
  function go() {
    var s = document.createElement('script');
    s.src = url;
    s.onload = function () { window.__watchdog.loaded = true; };
    s.onerror = function () { window.__watchdog.errs.push('스크립트를 못 불러옴: ' + url); };
    document.body.appendChild(s);
  }
  if (window.requestAnimationFrame) requestAnimationFrame(function () { setTimeout(go, 0); });
  else setTimeout(go, 30);
})();
</script>
<pre id="TESTOUT" style="display:none"></pre>
<script>
/* 재료가 흐르는가.
   프레스티지·돌파를 지날 때마다 두 가지를 본다.
     1) 자동화가 그대로 열려 있고 켜져 있는가 — 꺼지면 그 뒤로 아무것도 안 모인다
     2) 재료가 다시 쌓이는가 — 누적(Ever) 은 무엇을 해도 줄어선 안 된다
   실제로 자동 돌파가 60 초마다 터져 영혼석도 룬도 쌓이기 전에 쓸려 나가던
   적이 있다. 그건 '값이 이상하다' 가 아니라 '흐르지 않는다' 는 고장이라,
   숫자 검사로는 안 잡힌다. */
(async()=>{
  const O=document.getElementById('TESTOUT'), out=s=>{O.textContent+=s+'\n'};
  const fail=[]; const bad=(w,d)=>{ if(fail.length<40) fail.push(w+' :: '+d) };
  const F=x=>window.__game.fmtLog(x);
  try{
  await new Promise(r=>setTimeout(r,900));
  const G=window.__game; if(!G){ out('[!] __game 없음'); out('DONE'); return }
  const S=G.S;
  const MATS=[['mana','마나'],['soul','영혼석'],['relic','유물'],['star','별가루'],
              ['crystal','결정'],['offering','오퍼링']];
  const everL=k=>k==='mana'?S.manaEverL:G.everLogOf(k);
  const snapEver=()=>Object.fromEntries(MATS.map(([k])=>[k,everL(k)]));
  const autoState=()=>G.AUTO_DEFS.filter(a=>G.autoOK(a.k)).map(a=>a.k).join(',');

  /* 충분히 진행한 상태를 만든다 */
  for(const r of G.RESEARCH) S.research[r.id]=1;
  S.manaL=S.manaRunL=S.manaEverL=S.manaPeakL=340;
  for(const k of ['soul','relic','star','crystal','offering']) G.setRes(k,120);
  for(const k of ['soulEverL','relicEverL','starEverL','crystalEverL','offerEverL']) S[k]=120;
  S.soulAscL=120; S.relicTransL=120; S.bestRunL=200; S.bestAscL=100; S.bestTransL=100;
  for(let i=0;i<S.bought.length;i++) S.bought[i]=3000;
  S.deepest=600; S.deepestEver=600; S.floor=1; S.lootFloor=0; S.exploring=true;
  S.rebirthEver=50; S.ascendEver=10; S.transEver=2; S.infEver=2; S.infCount=2;
  G.recalc();
  for(const a of G.AUTO_DEFS) if(G.autoUnlocked(a.k)) S.auto[a.k]=1;
  const auto0=autoState();
  out(`자동화 ${auto0.split(',').filter(Boolean).length}종 켜짐`);
  out('');
  out('  단계        | 자동화 | 5분 뒤 누적이 늘어난 재료');

  const LAYERS=[
    ['환생',()=>G.doRebirth(true)],
    ['승천',()=>{ S.soulAscL=Math.max(S.soulAscL,G.numLog(G.ASCEND_REQ)+3); G.recalc(); return G.doAscend(true) }],
    ['초월',()=>{ S.relicTransL=Math.max(S.relicTransL,G.numLog(G.TRANS_REQ)+3); G.recalc(); return G.doTranscend(true) }],
    ['무한 돌파',()=>{ S.manaEverL=Math.max(S.manaEverL,400); G.recalc(); return G.doInfBreak(0) }],
  ];
  /* 무한 위의 네 칸도 같은 잣대로 본다. 앞 칸을 열 개 모아야 다음 칸이 열리므로
     그 조건을 채워 준 뒤 돌파한다 — 시뮬에서는 영원 7 에서 멈춰 현실 위로는
     한 번도 돌아 본 적이 없던 자리다. */
  for(let i=1;i<G.INF_LAYERS.length;i++){
    const L=G.INF_LAYERS[i], P=G.INF_LAYERS[i-1];
    LAYERS.push([`${L.ko} 돌파`,()=>{
      S[P.k+'Ever']=Math.max(S[P.k+'Ever']||0,G.INF_STACK*3);   // 앞 칸을 넉넉히 모았다
      S[P.k]=Math.max(S[P.k]||0,G.reqFor(i)*5);                  // 돌파에 쓸 만큼 들고 있다
      G.recalc();
      if(!G.infUnlocked(i)) return false;
      return G.doInfBreak(i);
    }]);
  }
  for(const [nm,act] of LAYERS){
    const beforeEver=snapEver(), beforeAuto=autoState(), beforePeak=S.manaPeakL;
    let ok=false;
    try{ ok=act() }catch(e){ bad(nm,'실행 중 예외 '+e.message) }
    if(!ok){ out(`  ${nm.padEnd(11)} | (실행 안 됨 — 조건 미달)`); continue }
    G.recalc();
    /* 1) 자동화가 꺼지지 않았는가 */
    const afterAuto=autoState();
    const lost=beforeAuto.split(',').filter(k=>k&&afterAuto.split(',').indexOf(k)<0);
    if(lost.length) bad(nm,`자동화가 꺼졌다: ${lost.join(', ')}`);
    /* 2) 누적이 줄지 않았는가 */
    for(const [k,ko] of MATS){
      /* 돌파는 어느 칸이든 마나 누적을 일부러 지운다 — 다음 돌파 조건을 다시 벌게
         하기 위해서다. 지워지지 않는 진짜 기록은 manaPeakL 이고, 그건 봐야 한다. */
      if(/돌파/.test(nm)&&k==='mana') continue;   // 돌파는 모두 마나 누적을 지운다
      const b=beforeEver[k], a=everL(k);
      if(a<b-1e-9) bad(nm,`${ko} 누적이 ${F(b)} → ${F(a)} 로 줄었다`);
    }
    if(S.manaPeakL<beforePeak-1e-9) bad(nm,`마나 최고 기록이 ${F(beforePeak)} → ${F(S.manaPeakL)} 로 줄었다`);
    /* 3) 5 분을 굴려 재료가 다시 쌓이는가 */
    /* 흐름은 '잔액' 으로 잰다. 누적은 이미 10^340 쯤이라 새로 번 것이 파묻혀
       늘었는지 아닌지가 보이지 않는다 — 배정도의 한계이지 고장이 아니다. */
    const bal0=Object.fromEntries(MATS.map(([k])=>[k,k==='mana'?S.manaL:G.curL(k)]));
    const ever0=snapEver();
    /* 굴리는 5 분 사이에 자동 돌파가 일어날 수 있다. 돌파는 다음 조건을 다시
       벌게 하려고 마나 누적을 일부러 지운다 — 그걸 고장으로 세면 안 된다.
       진짜로 지워지지 않는 기록은 manaPeakL 이고 그건 아래에서 따로 본다. */
    const brk0=G.INF_LAYERS.map(L=>S[L.k]||0).join(',')+'|'+(S.rebirths|0)+'|'+(S.ascensions|0)+'|'+(S.transcends|0);
    for(let i=0;i<1500;i++) G.tick(0.2);          // 5 분
    const brk1=G.INF_LAYERS.map(L=>S[L.k]||0).join(',')+'|'+(S.rebirths|0)+'|'+(S.ascensions|0)+'|'+(S.transcends|0);
    const autoBroke=brk0!==brk1;
    G.recalc();
    const grew=[], flat=[];
    for(const [k,ko] of MATS){
      const a=k==='mana'?S.manaL:G.curL(k);
      (a>bal0[k]+1e-9?grew:flat).push(ko);
      if(everL(k)<ever0[k]-1e-9&&!(autoBroke&&k==='mana'))
        bad(nm,`${ko} 누적이 5분 사이 ${F(ever0[k])} → ${F(everL(k))} 로 줄었다`);
    }
    if(!grew.length) bad(nm,'5분을 굴려도 어떤 재료도 잔액이 늘지 않았다');
    /* 자동 돌파가 마나 누적을 지우더라도 최고 기록은 절대 줄면 안 된다 */
    if(S.manaPeakL<beforePeak-1e-9) bad(nm,`5분 사이 마나 최고 기록이 ${F(beforePeak)} → ${F(S.manaPeakL)} 로 줄었다`);
    const auto2=autoState();
    const lost2=beforeAuto.split(',').filter(k=>k&&auto2.split(',').indexOf(k)<0);
    if(lost2.length) bad(nm,`5분 사이 자동화가 꺼졌다: ${lost2.join(', ')}`);
    out(`  ${nm.padEnd(11)} | ${String(auto2.split(',').filter(Boolean).length).padStart(3)}종 | ${grew.join(' ')||'(없음)'}${flat.length?'   · 그대로: '+flat.join(' '):''}${autoBroke?'   (사이에 자동 돌파)':''}`);
  }
  }catch(e){ bad('하네스',e.message+' @ '+(e.stack||'').split('\n')[1]) }
  out('');
  for(const f of fail) out('  [!] '+f);
  out(`=== 재료 흐름 위반 ${fail.length}건 ===`);
  out('DONE');
})();
</script>
