<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>무한의 탑</title>
<meta name="description" content="탑을 세워 지구를 벗어나 은하와 무한 너머까지 오르는 방치형 게임">
<meta name="theme-color" content="#0b0b0d">
<meta property="og:title" content="무한의 탑">
<meta property="og:description" content="단일 HTML 방치형 게임 · 지구에서 근원까지 · 도트 470여 종 직접 제작">
<meta property="og:type" content="website">
<link rel="icon" type="image/png" href="art/sprites/tower.png">
<style>
/* ═══════════════════════════════════════════════
   무한의 탑 · 도트 UI
   ═══════════════════════════════════════════════ */
:root{
  --ink:#0b0b0d; --ink2:#111114;
  --stone:#1a1a1f; --stone2:#22222a; --stone3:#2e2e37;
  --edge:#3d3a33; --edge2:#5c5748;
  --gold:#d4a94a; --gold2:#ecd08a; --goldDk:#7a5f28;
  --txt:#ddd6c6; --dim:#8c9b8f; --faint:#5d6259;
  --mana:#9fc4d8; --soul:#a89bbd; --relic:#c96a52;
  --offer:#e0b95f; --crystal:#b8dbe8;
  --good:#8fae86; --bad:#b04a3a;
  /* 전부 sans. 제목은 굵기·자간으로만 구분한다 */
  --sans:'Pretendard','Apple SD Gothic Neo','Noto Sans KR',-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  --serif:var(--sans);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
body{
  background:
    radial-gradient(900px 460px at 50% -160px, rgba(212,169,74,.10), transparent 72%),
    radial-gradient(760px 420px at 10% 108%, rgba(140,155,143,.05), transparent 72%),
    repeating-linear-gradient(112deg, rgba(255,255,255,.012) 0 2px, transparent 2px 8px),
    linear-gradient(180deg,#101013,#08080a);
  background-attachment:fixed;
  color:var(--txt); font-family:var(--sans); font-size:14.5px; line-height:1.55;
  -webkit-font-smoothing:antialiased; overflow-x:hidden;
}
button{font-family:inherit;color:inherit;font-size:inherit}
h1,h2,h3{margin:0;font-family:var(--sans);font-weight:700;letter-spacing:.01em}
img{display:block}
img.px{display:inline-block;vertical-align:-3px}   /* 글 속 도트가 줄을 바꾸지 않게 */
.px{image-rendering:pixelated;image-rendering:crisp-edges;flex:none}

/* ── 상단 ─────────────────────────── */
#top{
  position:sticky;top:0;z-index:60;
  background:linear-gradient(180deg,rgba(10,7,20,.97),rgba(10,7,20,.86));
  border-bottom:1px solid var(--edge);
  box-shadow:0 10px 26px rgba(0,0,0,.6), 0 1px 0 rgba(212,169,74,.16);
  backdrop-filter:blur(10px);
}
#brand{display:flex;align-items:center;gap:10px;padding:9px 16px 4px;max-width:1320px;margin:0 auto}
#brand h1{font-size:19px;letter-spacing:.06em;
  background:linear-gradient(180deg,var(--gold2),var(--gold) 55%,#a9822f);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  text-shadow:0 1px 0 rgba(0,0,0,.5)}
#brand .sub{font-size:11px;color:var(--faint);font-family:var(--serif);letter-spacing:.14em}
#brand .ver{margin-left:auto;font-size:10.5px;color:var(--faint)}

#res{display:flex;gap:8px;padding:4px 16px 10px;max-width:1320px;margin:0 auto;
  overflow-x:auto;scrollbar-width:none}
#res::-webkit-scrollbar{display:none}
.res{
  flex:1 1 150px;min-width:132px;
  background:linear-gradient(180deg,rgba(255,255,255,.055),transparent 60%),linear-gradient(180deg,var(--stone2),var(--stone));
  border:1px solid var(--edge);border-radius:3px;padding:6px 10px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.09), inset 0 0 0 1px rgba(212,169,74,.06), 0 3px 10px rgba(0,0,0,.45);
  display:flex;gap:9px;align-items:center;
}
.res .txt{min-width:0;flex:1}
.res .lab{font-size:10.5px;color:var(--dim);letter-spacing:.06em;font-family:var(--serif)}
.res .val{font-size:18px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.01em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.25}
.res .sub{font-size:10.5px;color:var(--faint);font-variant-numeric:tabular-nums;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.res.mana .val{color:var(--mana);text-shadow:0 0 14px rgba(159,196,216,.26)}
.res.offer .val{color:var(--offer)}
.res.crystal .val{color:var(--crystal)}
.res.soul .val{color:var(--soul);text-shadow:0 0 14px rgba(168,155,189,.28)}
.res.relic .val{color:var(--relic)}
.res.floor .val{color:var(--gold)}

/* ── 탭 ─────────────────────────── */
#shell{
  max-width:1320px;margin:0 auto;padding:14px 16px 60px;
  display:grid;grid-template-columns:214px minmax(0,1fr);gap:14px;align-items:start;
}
#side{position:sticky;top:calc(var(--topH,118px) + 12px)}
#tabs{display:flex;flex-direction:column;gap:3px}
#sidestat{
  margin-top:10px;padding:11px 12px;border-radius:4px;font-size:11.5px;line-height:1.85;
  background:linear-gradient(180deg,rgba(255,255,255,.035),transparent 45%),linear-gradient(180deg,var(--stone2),var(--stone));
  border:1px solid var(--edge);color:var(--dim);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.07), 0 4px 14px rgba(0,0,0,.45);
}
#sidestat .k{color:var(--faint);font-size:10.5px;letter-spacing:.05em}
#sidestat .v{color:var(--txt);font-variant-numeric:tabular-nums}
#sidestat .mini{height:6px;border-radius:2px;background:#0c0c0e;border:1px solid var(--edge);overflow:hidden;margin:3px 0 7px}
#sidestat .mini>i{display:block;height:100%;background:linear-gradient(90deg,#7a2a20,#cf7a63)}
#sidestat hr{border:0;border-top:1px solid var(--edge);margin:8px 0}
.tab{
  position:relative;background:linear-gradient(180deg,var(--stone),rgba(12,9,22,.5));
  border:1px solid transparent;border-radius:3px;
  padding:8px 11px;color:var(--dim);white-space:nowrap;cursor:pointer;width:100%;
  display:flex;align-items:center;gap:8px;font-size:13.5px;letter-spacing:.02em;
  user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation;transition:color .12s,background .12s;
}
.tab:hover{color:var(--txt);background:linear-gradient(180deg,var(--stone2),rgba(12,9,22,.5))}
.tab.on{
  color:var(--gold);border-color:var(--edge);
  background:linear-gradient(180deg,var(--stone3),var(--stone));
  box-shadow:inset 0 1px 0 rgba(212,169,74,.25);
}
.tab.on::after{content:'';position:absolute;left:-1px;top:-1px;bottom:-1px;width:2px;
  background:linear-gradient(180deg,transparent,var(--gold),transparent)}
.tab.locked{opacity:.32;pointer-events:none;filter:grayscale(.7)}
.tab .n{font-size:9.5px;color:var(--faint);margin-left:auto}
.tab .dot{width:6px;height:6px;border-radius:50%;background:var(--gold);box-shadow:0 0 7px var(--gold);display:none}
.tab.alert .dot{display:block}

/* ── 본문 ─────────────────────────── */
main{min-width:0}
.panel{display:none} .panel.on{display:block}

.card{
  position:relative;margin-bottom:12px;padding:13px 15px 15px;border-radius:4px;
  background:linear-gradient(180deg,rgba(255,255,255,.045),transparent 44%),linear-gradient(180deg,var(--stone2),var(--stone));
  border:1px solid var(--edge);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.08), inset 0 0 34px rgba(0,0,0,.34), 0 5px 18px rgba(0,0,0,.5);
}
/* 네 귀퉁이 금장식 */
.card::before,.card::after{content:'';position:absolute;width:11px;height:11px;pointer-events:none;opacity:.75}
.card::before{top:3px;left:3px;border-top:1px solid var(--goldDk);border-left:1px solid var(--goldDk)}
.card::after{bottom:3px;right:3px;border-bottom:1px solid var(--goldDk);border-right:1px solid var(--goldDk)}
.card > h2{
  display:flex;align-items:center;gap:8px;font-size:15px;color:var(--gold);
  letter-spacing:.05em;margin-bottom:3px;
}
.card > h2::after{content:'';flex:1;height:1px;
  background:linear-gradient(90deg,rgba(212,169,74,.5),rgba(212,169,74,.05))}
.hint{font-size:12px;color:var(--dim);margin-bottom:11px;line-height:1.6}
.hint b{color:var(--gold2);font-weight:600}
.row{display:flex;align-items:center;gap:7px;flex-wrap:wrap}

/* ── 버튼 ─────────────────────────── */
.btn{
  position:relative;display:inline-flex;align-items:center;justify-content:center;gap:7px;
  min-height:38px;padding:8px 14px;border-radius:3px;cursor:pointer;
  background:linear-gradient(180deg,var(--stone3),var(--stone));
  border:1px solid var(--edge2);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.13), 0 2px 0 rgba(0,0,0,.45);
  font-variant-numeric:tabular-nums;user-select:none;-webkit-tap-highlight-color:transparent;
  touch-action:manipulation;transition:border-color .1s,background .1s,transform .05s;
}
.btn:hover:not(:disabled){border-color:var(--gold);background:linear-gradient(180deg,#35333c,#1e1e24)}
.btn:active:not(:disabled){transform:translateY(1px);box-shadow:inset 0 2px 5px rgba(0,0,0,.55)}
.btn:disabled{opacity:.4;cursor:default;filter:grayscale(.45)}
.btn.gold{border-color:var(--gold);color:var(--gold2);
  background:linear-gradient(180deg,#453619,#241c0e);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.18), 0 0 15px rgba(212,169,74,.16), 0 2px 0 rgba(0,0,0,.45)}
.btn.gold:hover:not(:disabled){background:linear-gradient(180deg,#574421,#2d2312)}
.btn.big{width:100%;min-height:52px;font-size:15px;font-family:var(--serif);letter-spacing:.05em}
.btn.sm{min-height:30px;padding:4px 10px;font-size:12px;border-radius:3px}
.btn.on{border-color:var(--gold);color:var(--gold2);background:linear-gradient(180deg,#3a2e14,#211a0c)}
.btn.off{color:var(--faint)}
.btn .c{font-size:11.5px;color:var(--dim);font-weight:400}
.btn.can .c{color:var(--gold2)}

/* ── 시설 목록 ─────────────────────── */
.unit{
  display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;
  padding:9px 12px;margin-bottom:7px;border-radius:3px;
  background:linear-gradient(180deg,rgba(255,255,255,.035),transparent 60%),var(--stone);
  border:1px solid #302d26;transition:border-color .12s,box-shadow .12s;
}
.unit.can{border-color:var(--edge2);box-shadow:0 0 0 1px rgba(212,169,74,.13) inset}
.unit .ico{width:72px;height:72px;display:grid;place-items:center;border-radius:3px;
  background:radial-gradient(circle at 50% 38%, rgba(212,169,74,.16), rgba(0,0,0,.32));
  border:1px solid #3a372f}
.unit .nm{font-family:var(--serif);font-size:15px;letter-spacing:.03em}
.unit .dt{font-size:12px;color:var(--mana);font-variant-numeric:tabular-nums}
.unit .own{font-size:11.5px;color:var(--faint);font-variant-numeric:tabular-nums}
.unit .buy{min-width:150px;flex-direction:column;gap:1px}

/* ── 업그레이드 격자 ─────────────────── */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(228px,1fr));gap:8px}
.grid.wide{grid-template-columns:repeat(auto-fill,minmax(290px,1fr))}
.up{
  display:flex;gap:10px;align-items:flex-start;text-align:left;padding:10px 11px;min-height:74px;
  border-radius:3px;cursor:pointer;
  background:linear-gradient(180deg,rgba(255,255,255,.035),transparent 55%),var(--stone);
  border:1px solid #302d26;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.055);
  user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation;
  transition:border-color .12s,box-shadow .12s,transform .05s;
}
.up:hover:not(:disabled){border-color:var(--edge2)}
.up:active:not(:disabled){transform:translateY(1px)}
.up .ic{width:54px;height:54px;display:grid;place-items:center;flex:none;border-radius:3px;
  background:radial-gradient(circle at 50% 40%, rgba(212,169,74,.14), rgba(0,0,0,.3));border:1px solid #37342c}
.up .bd{min-width:0;flex:1}
.up .t{font-family:var(--serif);font-size:13.5px;letter-spacing:.02em;display:flex;gap:6px;align-items:baseline;flex-wrap:wrap}
.up .lv{font-size:10.5px;color:var(--faint);font-family:var(--sans)}
.up .d{display:block;font-size:11.5px;color:var(--dim);line-height:1.45;margin:1px 0 3px}
.chal .goal{display:block;margin-bottom:2px}
.up .c{font-size:11.5px;font-variant-numeric:tabular-nums;color:var(--dim);display:flex;align-items:center;gap:4px}
.up.afford{border-color:var(--gold);box-shadow:inset 0 0 0 1px rgba(212,169,74,.2), 0 0 13px rgba(212,169,74,.09)}
.up.afford .c{color:var(--gold2)}
.up.done{border-color:#4e6b46;background:linear-gradient(180deg,rgba(143,174,134,.09),transparent 60%),var(--stone)}
.up.done .c{color:var(--good)}
.up.lock{opacity:.4;cursor:default}
.up:disabled{cursor:default}

/* ── 던전 ─────────────────────────── */
.arena{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;
  padding:12px;border-radius:3px;border:1px solid #3a372f;
  background:radial-gradient(400px 130px at 22% 0%, rgba(176,74,58,.16), transparent 70%),
             linear-gradient(180deg,#17171b,#0e0e11)}
.arena .foe{width:104px;height:104px;display:grid;place-items:center;border-radius:3px;
  background:radial-gradient(circle at 50% 42%, rgba(176,74,58,.20), rgba(0,0,0,.4));
  border:1px solid #3a2a26}
.arena .foe.boss{border-color:#7a3a2c;box-shadow:0 0 18px rgba(176,74,58,.30)}
.hpbar{height:19px;border-radius:2px;overflow:hidden;position:relative;
  background:#0c0c0e;border:1px solid #3a372f;box-shadow:inset 0 2px 5px rgba(0,0,0,.6)}
.hpbar>i{display:block;height:100%;width:0;transition:width .1s linear;
  background:linear-gradient(180deg,#cf7a63,#7a2a20);box-shadow:0 0 12px rgba(207,122,99,.35)}
.hpbar>span{position:absolute;inset:0;display:grid;place-items:center;font-size:11px;
  font-variant-numeric:tabular-nums;text-shadow:0 1px 3px #000;letter-spacing:.03em}
.log{font-size:11.5px;color:var(--dim);background:#0c0c0e;border:1px solid #302d26;border-radius:3px;
  padding:8px 10px;height:150px;overflow-y:auto;font-variant-numeric:tabular-nums;line-height:1.65}
.log b{color:var(--txt)} .log .hl{color:var(--gold2)}
.log img{display:inline-block;vertical-align:-2px;margin-right:2px}

/* ── 업적 / 도전 ───────────────────── */
.ach{display:flex;gap:9px;align-items:center;padding:8px 10px;border-radius:3px;
  background:var(--stone);border:1px solid #26242a;opacity:.42;transition:.15s}
.ach.got{opacity:1;border-color:var(--goldDk);
  background:linear-gradient(180deg,rgba(212,169,74,.08),transparent 60%),var(--stone)}
.ach .t{font-family:var(--serif);font-size:13px}
.ach .d{font-size:11px;color:var(--dim)}
.chal{padding:11px 12px}
.chal .goal{font-size:11.5px;color:var(--dim);font-variant-numeric:tabular-nums}
.chal.active{border-color:var(--bad);box-shadow:0 0 0 1px rgba(176,74,58,.32) inset}

/* ── 기타 ─────────────────────────── */
.tag{font-size:11px;padding:2px 9px;border-radius:2px;border:1px solid #3a372f;color:var(--dim);
  background:rgba(0,0,0,.25);font-variant-numeric:tabular-nums;display:inline-flex;align-items:center;gap:5px}
.tag b{color:var(--txt)}
.divider{height:1px;margin:11px 0;background:linear-gradient(90deg,transparent,var(--edge),transparent)}
.gold{color:var(--gold2)} .dim{color:var(--dim)} .good{color:var(--good)} .bad{color:var(--bad)}
.mana{color:var(--mana)} .soul{color:var(--soul)} .relic{color:var(--relic)}
.offer{color:var(--offer)} .crystal{color:var(--crystal)}
.sw{display:inline-flex;align-items:center;gap:5px;vertical-align:-3px}

#modalWrap{position:fixed;inset:0;background:rgba(5,3,10,.8);display:none;align-items:center;
  justify-content:center;padding:20px;z-index:200;backdrop-filter:blur(3px)}
#modalWrap.on{display:flex}
#modal{max-width:470px;width:100%;max-height:82vh;overflow:auto;padding:20px 22px;border-radius:4px;
  background:linear-gradient(180deg,var(--stone2),var(--stone));border:1px solid var(--edge2);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.1), 0 24px 60px rgba(0,0,0,.75)}
#modal h3{color:var(--gold);font-size:17px;letter-spacing:.05em;margin-bottom:9px}
#modal .body{font-size:13px;color:var(--dim);line-height:1.8;margin-bottom:16px;font-variant-numeric:tabular-nums}
#modal .body b{color:var(--txt)}
/* 업적 배너 */
.achpop{
  position:fixed;left:50%;bottom:74px;transform:translate(-50%,16px);z-index:230;
  display:flex;align-items:center;gap:12px;padding:11px 20px 11px 15px;border-radius:4px;
  background:linear-gradient(180deg,#3a2d18,#221a0e);
  border:1px solid var(--gold);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.2), 0 0 34px rgba(212,169,74,.28), 0 12px 34px rgba(0,0,0,.65);
  opacity:0;animation:achIn .38s cubic-bezier(.2,1.3,.4,1) forwards;pointer-events:none;max-width:92vw;
}
.achpop.out{animation:achOut .45s ease-in forwards}
.achpop .ttl{font-size:10px;letter-spacing:.28em;color:var(--gold);font-family:var(--serif)}
.achpop .nm{font-family:var(--serif);font-size:16px;color:var(--gold2);letter-spacing:.03em}
.achpop .ds{font-size:11.5px;color:#cbb98e}
@keyframes achIn{from{opacity:0;transform:translate(-50%,22px) scale(.94)}
  to{opacity:1;transform:translate(-50%,0) scale(1)}}
@keyframes achOut{to{opacity:0;transform:translate(-50%,16px) scale(.97)}}

#toast{position:fixed;right:14px;bottom:14px;z-index:220;display:flex;flex-direction:column;
  gap:6px;align-items:flex-end;pointer-events:none}
#toast div{display:flex;align-items:center;gap:7px;font-size:12.5px;padding:7px 13px;border-radius:3px;
  background:linear-gradient(180deg,var(--stone3),var(--stone));border:1px solid var(--edge2);
  box-shadow:0 6px 18px rgba(0,0,0,.6);animation:pop .22s ease-out}
@keyframes pop{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}

/* ── 스크롤바 ─────────────────────── */
*{scrollbar-width:thin;scrollbar-color:#4a4740 #0c0c0e}
::-webkit-scrollbar{width:11px;height:11px}
::-webkit-scrollbar-track{background:#0c0c0e;border-left:1px solid #26241f}
::-webkit-scrollbar-thumb{
  border-radius:2px;border:2px solid #0c0c0e;
  background:linear-gradient(180deg,#5c5748,#37342d);
  box-shadow:inset 0 1px 0 rgba(212,169,74,.25)}
::-webkit-scrollbar-thumb:hover{background:linear-gradient(180deg,#6e6a58,#46433a)}
::-webkit-scrollbar-corner{background:#0c0c0e}
.log::-webkit-scrollbar{width:9px}
::selection{background:rgba(212,169,74,.28);color:#fff}

@media(max-width:900px){
  #shell{grid-template-columns:1fr;gap:10px;padding:10px}
  #side{position:static}
  #tabs{flex-direction:row;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
  #tabs::-webkit-scrollbar{display:none}
  .tab{width:auto}
  .tab .n{display:none}
  #sidestat{display:none}
}
@media(max-width:640px){
  .res{flex:1 1 128px;min-width:118px}
  .unit{grid-template-columns:auto 1fr;row-gap:8px}
  .unit .buy{grid-column:1/-1;width:100%}
  .grid{grid-template-columns:1fr}
  #brand h1{font-size:16px} #brand .sub{display:none}
}

/* ══ 도트 UI ═══════════════════════════════════
   9-slice 테두리는 art/ui/*.png. 가운데는 비어 있어
   원래 배경 그라디언트가 그대로 비친다.
   tools/build_ui.py 로 다시 굽는다. */
.card,#modal,.res,.btn,.tab,.unit,.up,.ach,.arena,#sidestat,.achpop,#toast div,.log,.hpbar{
  border-radius:0;
  image-rendering:pixelated;image-rendering:crisp-edges;
}
.card,.arena,#sidestat{
  border:8px solid transparent;border-image:url('art/ui/panel.png') 8 stretch;
}
.card{padding:6px 8px 8px}
.arena{padding:5px}
#sidestat{padding:4px 5px}
.card::before,.card::after{display:none}

#modal{border:8px solid transparent;border-image:url('art/ui/modal.png') 8 stretch;padding:13px 15px}

.res{border:6px solid transparent;border-image:url('art/ui/plate.png') 6 stretch;padding:2px 5px}

.btn{border:6px solid transparent;border-image:url('art/ui/btn.png') 6 stretch;padding:3px 9px;
     box-shadow:none}
.btn:hover:not(:disabled){border-image:url('art/ui/btn_hover.png') 6 stretch;background:linear-gradient(180deg,#35333c,#1e1e24)}
.btn:active:not(:disabled){border-image:url('art/ui/btn_active.png') 6 stretch;transform:none;box-shadow:none}
.btn.gold,.btn.on{border-image:url('art/ui/btn_gold.png') 6 stretch;box-shadow:0 0 15px rgba(212,169,74,.14)}
.btn.gold:hover:not(:disabled),.btn.on:hover:not(:disabled){border-image:url('art/ui/btn_gold_hover.png') 6 stretch}
.btn.sm{min-height:30px;padding:1px 6px}
.btn.big{min-height:52px}

.tab{border:6px solid transparent;border-image:url('art/ui/tab.png') 6 stretch;padding:3px 6px}
.tab.on{border-image:url('art/ui/tab_on.png') 6 stretch;box-shadow:none}
.tab.on::after{display:none}
.tab:hover:not(.on){border-image:url('art/ui/btn.png') 6 stretch}

.unit{border:6px solid transparent;border-image:url('art/ui/unit.png') 6 stretch;padding:4px 7px}
.unit.can{border-image:url('art/ui/up_afford.png') 6 stretch;box-shadow:none}

.up{border:6px solid transparent;border-image:url('art/ui/up.png') 6 stretch;padding:5px 6px;box-shadow:none}
.up.afford{border-image:url('art/ui/up_afford.png') 6 stretch;box-shadow:0 0 13px rgba(212,169,74,.10)}
.up.done{border-image:url('art/ui/up_done.png') 6 stretch}
.up:hover:not(:disabled){border-image:url('art/ui/btn_hover.png') 6 stretch}
.up.afford:hover:not(:disabled),.up.done:hover:not(:disabled){border-image:url('art/ui/up_afford.png') 6 stretch}

.ach{border:6px solid transparent;border-image:url('art/ui/unit.png') 6 stretch;padding:3px 5px}
.ach.got{border-image:url('art/ui/up_afford.png') 6 stretch}

.achpop{border:6px solid transparent;border-image:url('art/ui/btn_gold.png') 6 stretch;
        padding:6px 15px 6px 10px;box-shadow:0 0 34px rgba(212,169,74,.26),0 12px 34px rgba(0,0,0,.6)}
#toast div{border:6px solid transparent;border-image:url('art/ui/btn.png') 6 stretch;padding:2px 8px}

.unit .ico,.up .ic,.arena .foe{border-radius:0;border:2px solid #3a372f;
  box-shadow:inset 0 0 0 1px #0b0b0d}

/* 로고 */
#brand{padding:6px 16px 4px}
#brandLogo{width:129px;height:43px;flex:none}
#brand h1{margin:0;font-size:0;line-height:0}
@media(max-width:640px){#brand{padding:4px 10px 2px}}

/* 좁은 화면 가로 넘침 차단
   1fr 트랙은 min-width:auto 라서 내용이 줄어들지 않는다. minmax(0,1fr) 로 바꾼다. */
.unit{grid-template-columns:auto minmax(0,1fr) auto}
.unit>*{min-width:0}
.grid{grid-template-columns:repeat(auto-fill,minmax(228px,1fr))}
.grid.wide{grid-template-columns:repeat(auto-fill,minmax(290px,1fr))}
@media(max-width:900px){
  #shell{grid-template-columns:minmax(0,1fr)}
}
@media(max-width:640px){
  .unit{grid-template-columns:auto minmax(0,1fr)}
  .grid,.grid.wide{grid-template-columns:minmax(0,1fr)}
  .unit .buy{min-width:0}
}

/* ══ 레이아웃 도트 UI ═══════════════════════════
   막대·우물·구분선·태그·로그·헤더·배경·스크롤바까지
   전부 art/ui/*.png 도트로 그린다. CSS 그라디언트는 남기지 않는다. */
html{image-rendering:pixelated}
body{
  background:
    url('art/ui/bg_glow.png') repeat-x top,
    url('art/ui/bg.png') repeat,
    #0e0e11;
  background-attachment:fixed;
}

#top{
  background:url('art/ui/bg.png') repeat, #0b0b0e;
  border-bottom:0; box-shadow:none; backdrop-filter:none; position:sticky;
}
#top::after{content:'';position:absolute;left:0;right:0;bottom:-4px;height:4px;
  background:url('art/ui/topedge.png') repeat-x;pointer-events:none}

/* 진행 막대 */
.hpbar{height:20px;padding:0;overflow:hidden;background:#0c0c0e;box-shadow:none;
  border:4px solid transparent;border-image:url('art/ui/bar.png') 4 stretch}
.hpbar>i{background:url('art/ui/fill_hp.png') repeat-x;box-shadow:none}
#sidestat .mini{height:10px;margin:3px 0 7px;background:#0c0c0e;overflow:hidden;
  border:2px solid transparent;border-image:url('art/ui/bar_sm.png') 2 stretch;border-radius:0}
#sidestat .mini>i{background:url('art/ui/fill_hp_sm.png') repeat-x}

/* 아이콘 우물 */
.unit .ico,.up .ic,.arena .foe{
  background:#141419;box-shadow:none;border-radius:0;
  border:5px solid transparent;border-image:url('art/ui/well.png') 5 stretch}
.unit .ico{width:42px;height:42px}
.up .ic{width:42px;height:42px}
.arena .foe{width:74px;height:74px}
.arena .foe.boss{border-image:url('art/ui/up_afford.png') 5 stretch}

/* 구분선 */
.divider{height:9px;margin:9px 0;position:relative;border:0;
  background:url('art/ui/rule.png') repeat-x center}
.divider::after{content:'';position:absolute;left:50%;top:0;margin-left:-5px;
  width:11px;height:9px;background:url('art/ui/rule_mid.png') no-repeat}
.card > h2::after{height:5px;background:url('art/ui/rule.png') repeat-x center}

/* 태그 · 로그 */
.tag{padding:1px 7px;border-radius:0;background:rgba(0,0,0,.3);
  border:3px solid transparent;border-image:url('art/ui/tag.png') 3 stretch}
.log{padding:4px 7px;border-radius:0;background:#0c0c0e;
  border:5px solid transparent;border-image:url('art/ui/inset.png') 5 stretch}

/* 탭 알림 점 */
.tab .dot{width:7px;height:7px;border-radius:0;box-shadow:none;
  background:url('art/ui/dot.png') no-repeat}

/* 모달 뒷막 : 흐림 대신 도트 디더 */
#modalWrap{background:url('art/ui/dither.png') repeat;backdrop-filter:none}

/* 자동화 스위치 */
.sw{vertical-align:-2px;margin-right:5px}

/* 스크롤바 */
*{scrollbar-width:thin;scrollbar-color:#403d34 #0c0c0e}
::-webkit-scrollbar{width:12px;height:12px}
::-webkit-scrollbar-track{background:url('art/ui/scroll_track.png') repeat;border:0}
::-webkit-scrollbar-thumb,::-webkit-scrollbar-thumb:hover{
  background:url('art/ui/scroll_thumb.png') repeat;border:0;border-radius:0;box-shadow:none}
::-webkit-scrollbar-corner{background:#0c0c0e}

/* 도트 아이콘과 숫자는 한 줄로 — 사이에서 줄이 갈라지면 값이 두 줄로 찢어진다 */
.btn .c,.up .c,.unit .dt,.unit .own,.res .val,.res .sub,.tag,.ach .d,.chal .goal,
#sidestat .v,.achpop .ds{white-space:nowrap}
.btn .c img.px,.tag img.px,.unit .dt img.px,.log img.px{vertical-align:-3px;margin-right:1px}
.btn .c{display:inline-flex;align-items:center;gap:3px}
.unit .buy{min-width:0}

/* ══ 장(章) ═════════════════════════════════════
   우주 계층을 한 칸 올라갈 때마다 바탕과 강조색이 바뀐다.
   무늬는 그대로라 "같은 게임의 다음 장"으로 읽힌다. */

html[data-chapter="1"]{--gold:#4ad4c2;--gold2:#8aecdf;--goldDk:#287a6e}

/* 새 장에 들어설 때 뜨는 띠 */
#chapter{position:fixed;left:0;right:0;top:0;z-index:240;pointer-events:none;
  display:flex;align-items:center;justify-content:center;height:100vh;opacity:0}
#chapter.on{animation:chIn 3.2s ease-out forwards}
#chapter .box{padding:14px 26px;background:rgba(8,8,12,.88);
  border:6px solid transparent;border-image:url('art/ui/btn_gold.png') 6 stretch;text-align:center}
#chapter .k{font-size:11px;letter-spacing:.34em;color:var(--gold)}
#chapter .t{font-size:24px;font-weight:700;color:var(--gold2);letter-spacing:.06em;margin-top:2px}
@keyframes chIn{0%{opacity:0;transform:scale(.96)}12%{opacity:1;transform:none}
  78%{opacity:1}100%{opacity:0}}

const SPR_DIR='art/sprites/';
const spriteURL = name => SPR_DIR + name + '.png';
function ic(name,size){
  const n=size||SPR[name]||16;
  const i=document.createElement('img');
  i.className='px'; i.src=spriteURL(name); i.width=n; i.height=n; i.alt=''; i.loading='eager';
  return i;
}
function icHTML(name,size){
  const n=size||16;   // 글 속에서는 원본 크기 그대로
  return `<img class="px" src="${spriteURL(name)}" width="${n}" height="${n}" alt="">`;
}

function fmt(n){
  if(n===Infinity) return '∞';
  if(n===-Infinity) return '-∞';
  if(typeof n!=='number'||isNaN(n)) return '0';   // 망가진 값만 0. 무한대는 무한대로 보여 준다.
  if(n<0) return '-'+fmt(-n);
  if(n===0) return '0';
  if(n<1e3){
    if(n<10) return (Math.round(n*100)/100).toString();
    if(n<100) return (Math.round(n*10)/10).toString();
    return Math.floor(n).toString();
  }
  if(n<1e6) return Math.floor(n).toLocaleString(LANG==='en'?'en-US':'ko-KR');
  const e=Math.floor(Math.log10(n));
  return (n/Math.pow(10,e)).toFixed(2)+'e'+e;   // 이름 대신 지수로만
}


function fmtTime(s){
  s=Math.floor(s);
  const U=LANG==='en'?['s','m','h','d']:['초','분','시간','일'];
  const j=(a,b)=>LANG==='en'?a+' '+b:a+' '+b;
  if(s<60) return s+U[0];
  if(s<3600) return j(Math.floor(s/60)+U[1], (s%60)+U[0]);
  if(s<86400) return j(Math.floor(s/3600)+U[2], Math.floor(s%3600/60)+U[1]);
  return j(Math.floor(s/86400)+U[3], Math.floor(s%86400/3600)+U[2]);
}

function computeM(){
  const m={prod:1,t0:1,tUp:1,speed:1,soul:1,offer:1,crystal:1,dungeon:1,relic:1,
    floorPct:0.02,floorLoot:1,boss:1,costGrow:0,runeCap:25,gearPow:1,
    autoSpeed:1,offline:4,chalPow:1,autoMax:false};
  const ch=curChal();
  if(!(ch&&ch.rule.noResearch)) for(const r of RESEARCH) if(S.research[r.id]) r.apply(m);
  if(!(ch&&ch.rule.noRelicGear)){
    for(const r of RUNES){const l=S.runes[r.id]||0; if(l) r.apply(m,l);}
    for(const g of GEAR){const l=S.gear[g.id]||0; if(l) g.apply(m,l);}
  }
  for(const u of SOUL_UPS){const l=S.soulUps[u.id]||0; if(l) u.apply(m,l);}
  for(const u of RELIC_UPS){const l=S.relicUps[u.id]||0; if(l) u.apply(m,l);}
  for(const u of STAR_UPS){const l=S.starUps[u.id]||0; if(l) u.apply(m,l);}
  { const v=infBonus(); m.prod*=v; m.soul*=v; m.offer*=v; m.crystal*=v; m.dungeon*=v; m.relic*=v; }
  for(const c of CHALLENGES){const n=S.chalDone[c.id]||0; if(n) c.apply(m,n*m.chalPow);}
  for(const ms of MILESTONES) if(S.rebirths>=ms.n) ms.apply(m);
  m.prod*=1+0.02*achCount();
  m.prod*=1+0.05*S.rebirths;
  m.prod*=1+m.floorPct*S.deepest;
  { const v=cosmosBonus(S.deepest||1);        // 행성·행성계·은하를 넘길 때마다
    m.prod*=v; m.soul*=v; m.offer*=v; m.crystal*=v; m.dungeon*=v; }
  m.dungeon*=1+0.03*S.deepest;
  if(ch&&ch.rule.drain) m.prod/=ch.rule.drain;
  if(ch&&ch.rule.slow) m.speed/=ch.rule.slow;
  m.autoSpeed=Math.max(0.15,m.autoSpeed);
  return m;
}
function recalc(){MC=computeM()}
function M(){return MC||(MC=computeM())}

function growth(i){return Math.max(1.05,PRODUCERS[i].g+M().costGrow)}
function costOf(i,n){
  const g=growth(i),b=S.bought[i];
  return PRODUCERS[i].base*Math.pow(g,b)*(Math.pow(g,n)-1)/(g-1);
}
function maxAfford(i){
  const g=growth(i),b=S.bought[i];
  const v=S.mana*(g-1)/(PRODUCERS[i].base*Math.pow(g,b))+1;
  return v<=1?0:Math.max(0,Math.floor(Math.log(v)/Math.log(g)));
}
function tierLocked(i){const ch=curChal();return !!(ch&&ch.rule.maxTier!==undefined&&i>ch.rule.maxTier)}
function buyProducer(i){
  if(tierLocked(i)) return false;
  const n=S.buyAmt==='max'?maxAfford(i):S.buyAmt;
  if(n<=0) return false;
  const c=costOf(i,n);
  if(S.mana<c) return false;
  S.mana-=c; S.bought[i]+=n; recalc(); return true;
}
function manaRate(){const m=M();return cnt(0)*PRODUCERS[0].rate*m.t0*m.prod}
function gatherAmount(){return Math.max(1,manaRate()*0.5)}

function addMana(v){S.mana+=v;S.manaRun+=v;S.manaEver+=v}

   실제 천문학의 구조를 그대로 따른다.

   맨 윗 칸은 자릿수 제한이 없다 — 여기서 끝나지 않는다. */
const COSMOS=[

/* 칸을 하나 넘길 때마다 전체 생산에 붙는 배율. 위로 갈수록 가파르다. */
const COSMOS_SP=['sword','tower','offering','sparkle','spiral','star','crown16','gem','bolt','infinity','portal','soul'];
const COSMOS_MUL=[1, 1.5, 4, 12, 40, 150, 600, 2500, 1.2e4, 6e4, 3e5, 2e6];

function cosmos(f){
  const o={}; let div=1;
  for(let i=0;i<COSMOS.length;i++){
    if(i) div*=COSMOS[i].per;
    const cap = i+1<COSMOS.length ? COSMOS[i+1].per : Infinity;
    o[COSMOS[i].k] = Math.floor((f-1)/div) % cap + 1;
  }
  return o;
}
/* 지금 어느 장(章)에 있는가 — 1 보다 큰 가장 높은 칸 */
function chapterOf(f){
  const c=cosmos(f);
  let top=0;
  for(let i=1;i<COSMOS.length;i++) if(c[COSMOS[i].k]>1) top=i;
  if(top===0 && f<=100) return 0;          // 지구
  return Math.max(1,top);
}
/* 가 본 곳 중 가장 높은 장 */
const chapterSeen=()=>chapterOf(Math.max(1,S.deepest||1));
function chapterName(i,reveal){
  if(!reveal&&i>chapterSeen()) return '???';       // 못 뚫은 계층은 무엇인지 알 수 없다
  if(i===0) return X('지구','Earth');
  return X(COSMOS[i].ko, COSMOS[i].en);
}
function cosmosLabel(f){
  const c=cosmos(f), ch=chapterOf(f);
  if(ch===0) return X(`지구 · ${c.floor}층`, `Earth · F${c.floor}`);
  const p=[];
  for(let i=ch;i>=2;i--) p.push(X(`${COSMOS[i].ko} ${c[COSMOS[i].k]}`,`${COSMOS[i].en} ${c[COSMOS[i].k]}`));
  p.push(X(`행성 ${c.planet}`,`Planet ${c.planet}`));
  p.push(X(`${c.floor}층`,`F${c.floor}`));
  return p.join(' · ');
}
function cosmosBonus(f){
  const c=cosmos(f); let v=1;
  for(let i=1;i<COSMOS.length;i++) v*=Math.pow(COSMOS_MUL[i], c[COSMOS[i].k]-1);
  return isFinite(v)?v:1e300;
}

/* 항성계(제 3 장) 위로는 지구의 짐승 대신 천체와 기계가 나온다 */
function foeOf(f){

  const pool = isBoss(f) ? (cosmic?CBOSSES:BOSSES) : (cosmic?COSFOES:FOES);
  return isBoss(f) ? pool[(Math.floor(f/10)-1)%pool.length] : pool[(f-1)%pool.length];

function dungeonPower(){
  /* 시설 수는 완만하게(0.45제곱) 오르는데 층 체력은 지수로 오른다.
     그래서 원정대 공격력을 마나 생산에 묶는다. 생산이 오르면 던전도 따라 깊어진다. */
  let u=0;for(let i=0;i<PRODUCERS.length;i++)u+=cnt(i);
  const rate=Math.max(1,manaRate());
  return (1+Math.pow(u,0.45))*M().dungeon*Math.pow(rate,0.75);
}

  const a=Math.min(f-1,200), b=Math.max(0,f-1-200);

  log(`${icHTML('star')}<b>${X('초월','Transcendence')}</b> · ${X('별가루','Stardust')} <b class="gold">+${fmt(g)}</b> · ${X('유물과 승천까지 초기화되었다','relics and ascensions reset')}`,true);
  if(!silent) toast(icHTML('star')+X(` 초월 · 별가루 +${fmt(g)}`,` Transcend · Stardust +${fmt(g)}`));

}

/* ══════════════ 도전 ══════════════ */
const chalUnlocked=()=>S.ascensions>=1||chalTotal()>0;
function enterChallenge(id){
  const ch=CHALLENGES.find(c=>c.id===id);
  if(!ch||!chalUnlocked()) return;
  if((S.chalDone[id]||0)>=ch.max) return;
  S.chal=id; S.chalTime=0; softReset();
  log(`${icHTML('chain')}<b>${NM(ch.nm)}</b> ${X('시작 · 목표','started · goal')} ${icHTML('mana')}${fmt(chalGoal(ch,S.chalDone[id]||0))}`,true);
  toast(icHTML('chain')+' '+NM(ch.nm)+X(' 시작',' started'));
}
function exitChallenge(reset=true){
  S.chal=null; S.chalTime=0;
  if(reset) softReset();
  recalc();
}
function checkChallenge(){
  const ch=curChal(); if(!ch) return;
  const c=S.chalDone[ch.id]||0;
  if(S.manaRun>=chalGoal(ch,c)){
    S.chalDone[ch.id]=c+1;
    log(`${icHTML('medal')}<b class="gold">${NM(ch.nm)} ${X(`${c+1}단계 돌파!`,`stage ${c+1} cleared!`)}</b> · ${ch.rw(c+1)}`,true);
    achToast(NM(ch.nm)+X(' 돌파',' cleared'), ch.rw(c+1),'medal');
    exitChallenge(true);
    if(autoOK('chal')) autoEnterChallenge();
  }
}
/* 도달 가능성 판정 · 최고 회차 기록 대비 목표가 현실적인 시련만 고른다 */
function chalReachable(ch){
  const n=S.chalDone[ch.id]||0;
  if(n>=ch.max) return false;
  const penalty=(ch.rule.drain||1)*(ch.rule.noResearch?4:1)*(ch.rule.noAuto?3:1)*(ch.rule.maxTier!==undefined?3:1);
  return chalGoal(ch,n)*penalty <= S.bestRun*0.6;
}
function autoEnterChallenge(){
  if(!chalUnlocked()||S.chal) return;
  const avail=CHALLENGES.filter(chalReachable);
  if(!avail.length) return;
  avail.sort((a,b)=>(S.chalDone[a.id]||0)-(S.chalDone[b.id]||0)||a.base-b.base);
  enterChallenge(avail[0].id);
}

const AUTO_DEF=k=>AUTO_DEFS.find(a=>a.k===k);
/* 승천·초월로 최심층이 초기화되면 자동 탐험이 다시 잠기던 문제.
   한 번 조건을 만족한 자동화는 계속 열려 있다. */
function autoUnlocked(k){
  const d=AUTO_DEF(k); if(!d) return false;
  if(S.autoUnlocked&&S.autoUnlocked[k]) return true;
  if(d.unlock()){ (S.autoUnlocked=S.autoUnlocked||{})[k]=1; return true; }
  return false;
}
const autoOK=k=>!!(S.auto[k]&&autoUnlocked(k));
const AUTO_INTERVAL={gather:0.2,build:0.25,research:0.8,rune:1.2,gear:1.5};
function runAutomation(dt){
  const m=M(), ch=curChal();
  if(ch&&ch.rule.noAuto) return;
  const t=S.timers;
  for(const k in AUTO_INTERVAL) t[k]=(t[k]||0)+dt;
  const iv=k=>AUTO_INTERVAL[k]*m.autoSpeed;

  if(autoOK('gather')&&t.gather>=iv('gather')){t.gather=0;gather()}
  if(autoOK('build')&&t.build>=iv('build')){
    t.build=0;
    for(let i=PRODUCERS.length-1;i>=0;i--){
      if(tierLocked(i)) continue;
      if(m.autoMax){
        const n=maxAfford(i);
        if(n>0&&costOf(i,n)<=S.mana*0.5){S.mana-=costOf(i,n);S.bought[i]+=n;recalc();break}
      }
      const c=costOf(i,1);
      if(c<=S.mana*0.25){S.mana-=c;S.bought[i]++;recalc();break}
    }
  }
  if(autoOK('research')&&t.research>=iv('research')){
    t.research=0;
    if(!(ch&&ch.rule.noResearch))
      for(const r of RESEARCH){
        if(S.research[r.id]||(r.req&&!S.research[r.req])) continue;
        if(S.mana>=r.cost){S.mana-=r.cost;S.research[r.id]=1;recalc();break}
      }
  }
  if(autoOK('rune')&&t.rune>=iv('rune')){
    t.rune=0;
    const cap=Math.floor(m.runeCap);
    let best=null,bc=Infinity;
    for(const r of RUNES){const l=S.runes[r.id]||0;if(l>=cap)continue;const c=runeCost(l);if(c<bc){bc=c;best=r}}
    if(best&&S.offering>=bc){S.offering-=bc;S.runes[best.id]=(S.runes[best.id]||0)+1;recalc()}
  }
  if(autoOK('gear')&&t.gear>=iv('gear')){
    t.gear=0;
    let best=null,bc=Infinity;
    for(const g of GEAR){const l=S.gear[g.id]||0;const c=gearCost(l);if(c<bc){bc=c;best=g}}
    if(best&&S.crystal>=bc){S.crystal-=bc;S.gear[best.id]=(S.gear[best.id]||0)+1;recalc()}
  }
  // 영혼 / 유물 강화 자동 (가장 싼 것부터)
  if(autoOK('soulup')){
    let best=null,bc=Infinity;
    for(const u of SOUL_UPS){const l=S.soulUps[u.id]||0;if(l>=u.max)continue;const c=u.c(l);if(c<bc){bc=c;best=u}}
    if(best&&S.soul>=bc){S.soul-=bc;S.soulUps[best.id]=(S.soulUps[best.id]||0)+1;recalc()}
  }
  if(autoOK('relicup')){
    let best=null,bc=Infinity;
    for(const u of RELIC_UPS){const l=S.relicUps[u.id]||0;if(l>=u.max)continue;const c=u.c(l);if(c<bc){bc=c;best=u}}
    if(best&&S.relic>=bc){S.relic-=bc;S.relicUps[best.id]=(S.relicUps[best.id]||0)+1;recalc()}
  }
  // 환생 / 승천 · 직전 회차보다 확실히 나아졌을 때만
  if(autoOK('rebirth')&&S.sinceRebirth>20){
    const g=soulGain();
    if(g>=10&&g>=1.5*(S.lastSoulGain||0)) doRebirth(true);
  }
  if(autoOK('ascend')&&S.sinceAscend>120){
    const g=relicGain();
    if(g>=3&&g>=1.5*(S.lastRelicGain||0)) doAscend(true);
  }
  for(let i=INF_LAYERS.length-1;i>=0;i--){
    if(autoOK('inf')&&infUnlocked(i)&&infGain(i)>0){ doInfBreak(i); break; }
  }
  if(autoOK('trans')&&S.sinceTrans>300){
    const g=starGain();
    if(g>=2&&g>=1.5*(S.lastStarGain||0)) doTranscend(true);
  }
  for(let i=INF_LAYERS.length-1;i>=0;i--){
    if(autoOK('inf')&&infUnlocked(i)&&infGain(i)>0){ doInfBreak(i); break; }
  }
  if(autoOK('trans')&&S.sinceTrans>300){
    const g=starGain();
    if(g>=2&&g>=1.5*(S.lastStarGain||0)) doTranscend(true);
  }
}

/* ══════════════ 진행 ══════════════ */
function tick(dt){
  const m=M(), d=dt*m.speed, ch=curChal();
  for(let i=PRODUCERS.length-1;i>=1;i--) S.gen[i-1]+=cnt(i)*PRODUCERS[i].rate*m.tUp*d;
  addMana(cnt(0)*PRODUCERS[0].rate*m.t0*m.prod*d);
  if(S.exploring&&!(ch&&ch.rule.noDungeon)){
    /* 한 번에 여러 층이 쓸려 나가면 돌파하는 맛이 없다.
       공격력이 아무리 넘쳐도 한 층에는 최소 시간이 든다. */
    const hp=floorHP(S.floor);
    S.prog=Math.min(hp, S.prog+dungeonPower()*d);
    S.floorCd=Math.max(0,(S.floorCd||0)-d);
    if(S.prog>=hp&&S.floorCd<=0){
      S.prog=0; S.floorCd=FLOOR_MIN_TIME; clearFloor();
      if(!autoOK('dungeon')){ S.exploring=false; }   // 수동: 한 층마다 직접 다시 출격
    }
  }
  runAutomation(dt);
  if(ch){
    S.chalTime+=dt;
    // 15분 안에 못 깨면 승산이 없다고 보고 물러난다
    if(S.chalTime>900){
      log(`${icHTML('chain')}<b>${NM(ch.nm)}</b> ${X('철수','withdrawn')} · 아직 감당할 수 없다`,true);
      exitChallenge(true);
    }
  }else{
    S.chalTime=0;
    if(S.manaRun>S.bestRun) S.bestRun=S.manaRun;
  }
  checkChallenge();
  S.playtime+=dt; S.sinceRebirth+=dt; S.sinceAscend+=dt; S.sinceTrans+=dt;
  checkAchs();
  recalc();
}
function checkAchs(){
  for(const a of ACHS) if(!S.achs[a.id]&&a.f()){
    S.achs[a.id]=1;
    const tier=ACHS.indexOf(a);
    achToast(NM(a.nm),DS(a)+X(' · 마나 생산 +2%',' · Mana output +2%'),tier<10?'medal_b':tier<20?'medal_s':'medal');
    log(`${icHTML('medal')}${X('업적','Feat')} <b class="gold">${NM(a.nm)}</b> ${X('달성 · 마나 생산 +2%','unlocked · Mana output +2%')}`,true);
    flagTab('ach');
  }
}
function log(html,hl){
  LOG.unshift({html,hl}); if(LOG.length>80) LOG.pop();
  const el=document.getElementById('dlog');
  if(el) el.innerHTML=LOG.map(l=>`<div class="${l.hl?'hl':''}">${l.html}</div>`).join('');
}

/* ══════════════ DOM 헬퍼 ══════════════ */
const $=id=>document.getElementById(id);
function el(tag,cls,html){const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e}
function btn(cls,html,onClick){
  const b=document.createElement('button');
  b.type='button'; b.className='btn '+(cls||''); if(html!=null)b.innerHTML=html;
  if(onClick) b.addEventListener('click',e=>{e.preventDefault();onClick();refresh()});

}
function toast(html){
  const box=$('toast'), t=el('div',null,html);
  box.appendChild(t); while(box.children.length>4) box.firstChild.remove();
  setTimeout(()=>t.remove(),2600);
}
/* 업적 배너 (큰 알림) */
let achQueue=[],achBusy=false;
function achToast(title,desc,sprite){

}
function nextAch(){
  if(!achQueue.length){achBusy=false;return}

  setTimeout(()=>w.classList.add('out'),2400);
  setTimeout(()=>{w.remove();nextAch()},2900);
}

function switchTab(id){

}

function levelGrid(defs,lvOf,curOf,pay,curSp){
  const g=el('div','grid wide');
  defs.forEach(u=>{
    const b=document.createElement('button');
    b.type='button'; b.className='up';
    b.innerHTML=`<span class="ic"></span><span class="bd"><span class="t"></span><span class="d"></span><span class="c"></span></span>`;
    b.querySelector('.ic').appendChild(ic(u.sp,32));
    b.addEventListener('click',e=>{
      e.preventDefault();
      const l=lvOf(u.id);
      if(l>=u.max) return;
      const c=u.c(l);
      if(curOf()<c) return;
      pay(c,u.id); recalc(); refresh();
      toast(icHTML(u.sp)+' '+NM(u.nm)+' Lv.'+(l+1));
    });
    g.appendChild(b);
    updaters.push(()=>{
      const l=lvOf(u.id),maxed=l>=u.max,c=u.c(l),afford=!maxed&&curOf()>=c;
      b.querySelector('.t').innerHTML=`${NM(u.nm)} <span class="lv">Lv.${fmt(l)}${u.max!==Infinity?' / '+u.max:''}</span>`;
      b.querySelector('.d').textContent=u.d(l);
      b.querySelector('.c').innerHTML=maxed?`<span class="good">${X('최대치 도달','Maxed')}</span>`:`${icHTML(curSp)} ${fmt(c)}`;
      b.classList.toggle('done',maxed); b.classList.toggle('afford',afford); b.disabled=maxed;

function buildAch(p){

  const g=el('div','grid');
  /* 다 보여 주면 목표가 안 된다. 달성한 것과 바로 다음 몇 개만 드러내고
     그 너머는 무엇인지 알 수 없게 둔다. */
  const AHEAD=6;
  const rows=ACHS.map((a,i)=>{
    const d=el('div','ach');
    const icb=el('span'); d.appendChild(icb);
    const t=el('div'); d.appendChild(t); g.appendChild(d);
    return {a,i,d,icb,t};
  });
  updaters.push(()=>{
    let shown=0;
    rows.forEach(r=>{
      const got=!!S.achs[r.a.id];
      const reveal=got||shown<AHEAD;
      if(!got) shown+=reveal?1:0;
      r.d.classList.toggle('got',got);
      r.icb.innerHTML='';
      r.icb.appendChild(ic(reveal?(r.i<10?'medal_b':r.i<20?'medal_s':'medal'):'unknown',32));

  c.appendChild(g); p.appendChild(c);

    ${ch?`<div class="k">${X('진행 중인 시련',"Active trial")}</div><div class="v bad">${NM(ch.nm)}</div>`
        :`<div class="k">${X('다음 해금',"Next unlock")}</div><div class="v">${nextAuto?NM(nextAuto.nm):X('전부 해금','All unlocked')}</div>
          <div class="k">${nextAuto?DSF(nextAuto.req):''}</div>`}`;
}
function updateRes(){
  RES.forEach(r=>{
    const n=resNodes[r.id]; if(!n) return;
    const sh=r.show();
    n.box.style.display=sh?'':'none';
    if(sh){n.lab.textContent=NM(r.nm);n.val.textContent=r.val();n.sub.textContent=r.sub()}
  });
}

/* ══════════════ 렌더 ══════════════ */
let tabSig='';
function render(){
  const lb=$('langBtn'); if(lb) lb.textContent = LANG==='ko' ? 'EN' : '한국어';
  const bt=$('brandLogo'); if(bt) bt.alt=X('무한의 탑','Tower of Infinity');
  const sb=document.querySelector('#brand .sub'); if(sb) sb.style.display='none';
  const t=TABS.find(x=>x.id===curTab);
  if(!t||!t.open()) curTab='tower';
  updaters=[]; buildTabs();
  const main=$('main'); main.innerHTML='';
  const p=el('div','panel on'); p.id='p-'+curTab;
  BUILDERS[curTab](p); main.appendChild(p);
  refresh();
}
function refresh(){
  recalc(); updateRes(); updateSide();
  for(const u of updaters){try{u()}catch(e){console.error(e)}}
  const sig=TABS.map(t=>t.open()?1:0).join('');
  if(sig!==tabSig){tabSig=sig;buildTabs()}
}

/* ══════════════ 세이브 ══════════════ */
const enc=o=>btoa(unescape(encodeURIComponent(JSON.stringify(o))));
const dec=s=>JSON.parse(decodeURIComponent(escape(atob(s.trim()))));
function save(quiet){
  S.lastTick=Date.now();
  try{localStorage.setItem(SAVE_KEY,enc(S)); if(!quiet)toast(X('저장했습니다',"Saved")); return true}
  catch(e){toast(X('저장 실패: ','Save failed: ')+e.message); return false}
}
function load(){
  const raw=localStorage.getItem(SAVE_KEY); if(!raw) return false;
  try{
    S=mergeState(dec(raw)); return true;
  }catch(e){console.error(e);toast(X('세이브를 읽지 못했습니다',"Could not read the save"));return false}
}
function mergeState(o){
  const base=newState(), s=Object.assign(base,o);
  for(const k of ['bought','gen']){        // 단계가 늘어난 세이브도 진행을 잃지 않게 길이만 맞춘다
    if(!Array.isArray(s[k])) s[k]=[];
    while(s[k].length<PRODUCERS.length) s[k].push(0);
    s[k].length=PRODUCERS.length;
  }
  for(const k of ['research','runes','gear','soulUps','relicUps','starUps','achs','chalDone','autoUnlocked'])
    if(!s[k]||typeof s[k]!=='object') s[k]={};
  for(const k of ['mana','manaRun','manaEver','offering','offerEver','crystal','crystalEver',
                  'soul','soulAsc','soulEver','relic','relicEver','relicTrans','star','starEver'])
    if(typeof s[k]!=='number'||isNaN(s[k])) s[k]=0;   // 망가진 값만 되돌린다. 무한대는 돌파 조건이므로 살려 둔다.
  s.auto=Object.assign(newState().auto,o.auto||{});
  s.timers=Object.assign({build:0,research:0,rune:0,gear:0,gather:0},o.timers||{});
  return s;
}
function offlineCatchUp(){
  recalc();
  const cap=M().offline*3600;
  const dt=Math.min(cap,Math.max(0,(Date.now()-(S.lastTick||Date.now()))/1000));
  if(dt<60) return;
  const b={mana:S.mana,soul:S.soulEver,deep:S.deepest,reb:S.rebirths,cry:S.crystalEver};
  const steps=140;
  for(let i=0;i<steps;i++) tick(dt/steps);
  modal(`${icHTML('moon',16)} ${X('자리를 비운 사이','While you were away')}`,`
    ${X('경과','Away')} <b>${fmtTime(dt)}</b> <span class="dim">(${X('상한','cap')} ${fmtTime(cap)})</span><br>
    ${icHTML('mana')} ${X('마나','Mana')} <b class="mana">+${fmt(S.mana-b.mana)}</b><br>
    ${icHTML('crystal')} ${X('결정','Crystals')} <b class="crystal">+${fmt(S.crystalEver-b.cry)}</b><br>
    ${icHTML('soul')} ${X('영혼석','Soul Shards')} <b class="soul">+${fmt(S.soulEver-b.soul)}</b> <span class="dim">(${X(`환생 ${S.rebirths-b.reb}회`,`${S.rebirths-b.reb} rebirths`)})</span><br>
    ${S.deepest>b.deep?`${icHTML('sword')} ${X('최심층','Deepest')} <b class="gold">${X(b.deep+'층 → '+S.deepest+'층','F'+b.deep+' → F'+S.deepest)}</b>`:''}
  `);
}
function exportSave(){
  const blob=new Blob([enc(S)],{type:'text/plain'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  const t=new Date(),p=n=>String(n).padStart(2,'0');
  a.download=`마탑-세이브-${t.getFullYear()}${p(t.getMonth()+1)}${p(t.getDate())}-${p(t.getHours())}${p(t.getMinutes())}.txt`;
  a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),2000);
  toast(X('세이브를 내보냈습니다',"Save exported"));
}
function importSave(txt){
  try{
    const o=dec(txt);
    if(typeof o!=='object'||!('mana' in o)) throw new Error('형식이 다릅니다');
    S=mergeState(o); save(true); render();
    modal(X('불러오기 완료','Import complete'),X('세이브를 성공적으로 불러왔습니다.','The save was loaded successfully.'));
  }catch(e){modal(X('불러오기 실패','Import failed'),X('올바른 마탑 세이브 파일이 아닙니다.<br>','This is not a valid Tower of the Abyss save.<br>')+'<span class="dim">'+e.message+'</span>')}
}
function hardReset(){
  localStorage.removeItem(SAVE_KEY); S=newState(); LOG=[]; recalc(); render();
  toast(X('처음부터 다시 시작합니다',"Starting over"));
}

/* ══════════════ 루프 & 입력 ══════════════ */
let lastFrame=Date.now();
setInterval(()=>{
  const now=Date.now();
  let dt=(now-lastFrame)/1000; lastFrame=now;
  if(dt<0) dt=0; if(dt>2) dt=2;
  tick(dt);
},50);
setInterval(refresh,100);
setInterval(()=>save(true),15000);
window.addEventListener('beforeunload',()=>save(true));
document.addEventListener('visibilitychange',()=>{if(document.hidden)save(true)});

document.addEventListener('keydown',e=>{
  if(e.metaKey||e.ctrlKey||e.altKey) return;
  if(e.target.tagName==='INPUT') return;
  if(/^[0-9]$/.test(e.key)){
    const i=e.key==='0'?9:(+e.key-1);
    if(TABS[i]) switchTab(TABS[i].id);
    return;
  }
  const k=e.key.toLowerCase();
  if(e.key===' '){e.preventDefault();gather();refresh();return}
  if(k==='b'){const o=[1,10,100,'max'];S.buyAmt=o[(o.indexOf(S.buyAmt)+1)%o.length];refresh()}
  if(k==='e'){S.exploring=!S.exploring;if(!S.exploring)S.prog=0;refresh()}
  if(k==='s'){save()}
});
$('fileIn').addEventListener('change',ev=>{
  const f=ev.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>importSave(String(r.result));
  r.readAsText(f); ev.target.value='';
});

/* ══════════════ 시작 ══════════════ */
$('verTag').textContent='v'+VERSION;
$('langBtn').addEventListener('click',()=>setLang(LANG==='ko'?'en':'ko'));
document.documentElement.lang=LANG;
document.title=X('무한의 탑','Tower of Infinity');

{ // 파비콘도 직접 찍은 도트로
  const fav=document.querySelector('link[rel="icon"]')||document.createElement('link');
  fav.rel='icon'; fav.type='image/png'; fav.href=spriteURL('tower');
  document.head.appendChild(fav);
}
recalc(); buildRes(); syncChapter(true);
function syncTopH(){
  document.documentElement.style.setProperty('--topH', $('top').offsetHeight+'px');
}
window.addEventListener('resize',syncTopH);
setTimeout(syncTopH,0); setInterval(syncTopH,2000);
const had=load();
recalc();
if(had) offlineCatchUp();
else{
  log(icHTML('tower')+X('심연 위에 마탑을 세운다. 견습 마법사부터 불러들이자.','You raise a tower above the abyss. Summon an Apprentice Mage first.'),true);
  modal(`${icHTML('tower',16)} 무한의 탑`,`
    <b>견습 마법사</b>가 마나를 뽑아내고, 그 위 시설들이 아래 시설을 스스로 지어 올립니다.<br><br>
    처음에는 <b class="gold">직접</b> 해야 합니다. 마나를 채집하고, 시설을 올리고, 연구를 사고, 던전에 출격하고.<br>
    진행할수록 <b>자동화</b>가 하나씩 열립니다. 무엇이 언제 열리는지는 자동화 탭에서 볼 수 있습니다.<br><br>
    마나가 쌓이면 연구가 열리고, 던전 깊이가 곧 배율이 됩니다.
    한계에 닿으면 <b class="soul">환생</b>, 그 위에 <b class="relic">승천</b>, 다시 그 위에 <b>시련</b>이 기다립니다.
  `);
}
render();
</script>
